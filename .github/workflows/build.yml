name: Build Android 4.4.4 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 配置 JDK 环境
        uses: actions/setup-java@v4
        with:
          # 该项目原仓库为较老的 Gradle 结构，默认使用 JDK 8 兼容性最好
          # 如果你的 Fork 升级过 Gradle 7/8，请将此处改为 '11' 或 '17'
          java-version: '8'
          distribution: 'temurin'

      - name: 3. 确认并适配 Android 4.4.4 (API 19)
        run: |
          if [ -f "app/build.gradle" ]; then
            echo "当前 app/build.gradle 中的 SDK 配置："
            grep -E "SdkVersion|minSdk|targetSdk|compileSdk" app/build.gradle || true
          fi

      - name: 4. 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 5. 编译 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 6. 上传编译好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomTVDesktopLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
