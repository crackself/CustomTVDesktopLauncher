name: Build Android 4.4.4 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 配置 JDK 环境
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 3. 修复路径并自动生成缺失的 default.jks 签名文件
        run: |
          # 将原作者硬编码的 Windows 路径替换为相对路径
          sed -i -E "s|file\(['\"][^'\"]*\.jks['\"]\)|file('default.jks')|g" app/build.gradle
          # 自动生成与 build.gradle 中密码/别名完全匹配的密钥文件
          keytool -genkeypair -v \
            -keystore app/default.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias default \
            -storepass default \
            -keypass default \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 4. 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 5. 编译 Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: 6. 上传编译好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomTVDesktopLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
