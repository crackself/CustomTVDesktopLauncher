name: Build Android 4.4.4 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 配置 JDK 环境
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 3. 修复硬编码的 Windows 路径与签名配置
        run: |
          # 将 Windows 绝对路径替换为合法的 Linux 相对路径，解决 URISyntaxException
          sed -i -E "s|file\(['\"][^'\"]*\.jks['\"]\)|file('default.jks')|g" app/build.gradle
          # 取消对原作者自定义 signingConfig 的引用，让 assembleDebug 使用默认调试签名
          sed -i -E "s/signingConfig[[:space:]]+signingConfigs\.[a-zA-Z0-9_]+//g" app/build.gradle
          echo "修复后的 app/build.gradle 前 25 行："
          head -n 25 app/build.gradle

      - name: 4. 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 5. 编译 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 6. 上传编译好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomTVDesktopLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
